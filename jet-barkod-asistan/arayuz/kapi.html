<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Jet Barkod Asistan</title>
<link rel="stylesheet" href="kapi.css">
</head>
<body>
  <header class="bas">
    <img class="bas__logo" src="../varliklar/ikon48.png" alt="">
    <div class="bas__yazi">
      <h1 class="bas__ad">Jet Barkod Asistan</h1>
      <p class="bas__yer" id="yer">yükleniyor</p>
    </div>
    <span class="rozet" id="rozet"></span>
  </header>

  <main id="govde" class="govde">
    <p class="bos">Durum okunuyor...</p>
  </main>

  <section class="ayar" aria-label="Fırın bildirimi">
    <div class="ayar__metin">
      <p class="ayar__ad">Fırın Bildirimi</p>
      <p class="ayar__ozet">Kontrol panelinde pişirilecek ürün varsa sağ üstte haber verir.</p>
    </div>
    <select class="ayar__secim" id="firinAyar" aria-label="Fırın bildirimi kontrol sıklığı">
      <option value="0">Kapalı</option>
      <option value="3">3 dakikada bir</option>
      <option value="5">5 dakikada bir</option>
      <option value="10">10 dakikada bir</option>
      <option value="sim">Simülasyon (test)</option>
    </select>
  </section>

  <footer class="alt">
    <span class="alt__surum" id="surum"></span>
    <a class="alt__bag" id="siteBag" href="https://jetbarkod.com.tr/arama/" target="_blank" rel="noopener">Jet Barkod'u aç</a>
  </footer>

  <script src="kapi.js"></script>
</body>
</html>
