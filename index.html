<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Search System - Premium Giriş</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="assets/logo.png?v=2">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/logo.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/logo.png?v=2">
    <link rel="shortcut icon" href="assets/logo.png?v=2">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        
        /* Animated background particles */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(59, 130, 246, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(236, 72, 153, 0.05) 0%, transparent 50%);
            animation: backgroundShift 20s ease-in-out infinite;
            z-index: 0;
        }
        
        @keyframes backgroundShift {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }
        
        /* Glass morphism effect */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        
        .glass-input {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
        }
        
        .glass-input:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(59, 130, 246, 0.5);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            outline: none;
        }
        
        .glass-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }
        
        /* Premium button */
        .premium-btn {
            background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .premium-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }
        
        .premium-btn:hover::before {
            left: 100%;
        }
        
        .premium-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5);
        }
        
        .premium-btn:active {
            transform: translateY(0);
        }
        
        /* Logo animation */
        @keyframes logoFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        .logo-container {
            animation: logoFloat 3s ease-in-out infinite;
        }
        
        /* Fade in animation */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .fade-in-up {
            animation: fadeInUp 0.6s ease-out;
        }
        
        /* Feature icons */
        .feature-icon {
            transition: all 0.3s ease;
        }
        
        .feature-icon:hover {
            transform: scale(1.1) rotate(5deg);
        }
        
        /* Chat button */
        .chat-button {
            background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            transition: all 0.3s ease;
        }
        
        .chat-button:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
        }
        
        /* Error message */
        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            backdrop-filter: blur(10px);
        }
        
        /* Success message */
        .success-message {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            backdrop-filter: blur(10px);
        }
        
        /* Loading spinner */
        .spinner {
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Responsive adjustments */
        @media (max-width: 640px) {
            .glass-card {
                margin: 1rem;
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">
    <div class="w-full max-w-md relative z-10 fade-in-up">
        <!-- Logo ve Başlık -->
        <div class="text-center mb-10">
            <div class="logo-container inline-flex items-center justify-center w-24 h-24 mb-6">
                <div class="relative">
                    <div class="absolute inset-0 bg-gradient-to-br from-blue-500 to-purple-600 rounded-2xl blur-xl opacity-50"></div>
                    <div class="relative bg-gradient-to-br from-blue-0 to-purple-0 rounded-2xl p-4 shadow-2xl">
                        <img src="assets/logo.png" alt="Logo" class="w-20 h-20 object-contain">
                    </div>
                </div>
            </div>
            <h1 class="text-4xl font-bold text-white mb-3 tracking-tight">Product Search</h1>
            <p class="text-white/70 text-lg mb-2">Profesyonel Barkod Arama Sistemi</p>
        </div>

        <!-- Giriş Kartı -->
        <div class="glass-card rounded-3xl p-8 shadow-2xl">
            <div class="text-center mb-8">
                <h2 class="text-2xl font-semibold text-white mb-2">Hesabınıza Giriş Yapın</h2>
                <p class="text-white/60 text-sm">Güvenli ve hızlı erişim</p>
            </div>

            <!-- Giriş Formu -->
            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-white/90 text-sm font-medium mb-2.5">Kullanıcı Adı</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <svg class="w-5 h-5 text-white/40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                            </svg>
                        </div>
                    <input type="text" id="username" 
                               class="glass-input w-full pl-12 pr-4 py-3.5 rounded-xl text-white placeholder-white/40 focus:outline-none" 
                           placeholder="Kullanıcı adınızı girin" required>
                    </div>
                </div>
                
                <div>
                    <label class="block text-white/90 text-sm font-medium mb-2.5">Şifre</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <svg class="w-5 h-5 text-white/40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                            </svg>
                        </div>
                    <input type="password" id="password" 
                               class="glass-input w-full pl-12 pr-4 py-3.5 rounded-xl text-white placeholder-white/40 focus:outline-none" 
                           placeholder="Şifrenizi girin" required>
                    </div>
                </div>

                <button type="submit" 
                        class="premium-btn w-full text-white font-semibold py-3.5 px-4 rounded-xl transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-transparent relative">
                    <span id="loginText" class="relative z-10">Giriş Yap</span>
                    <span id="loginSpinner" class="hidden relative z-10 flex items-center justify-center">
                        <div class="spinner w-5 h-5 mr-2"></div>
                        <span>Giriş yapılıyor...</span>
                    </span>
                </button>
            </form>

            <!-- IP Ban Mesajı (Inline) -->
            <div id="ipBanMessage" class="mt-4 p-4 rounded-xl bg-red-500/20 border border-red-500/30 text-red-200 text-sm hidden">
                <div class="flex items-center">
                    <svg class="w-5 h-5 mr-2 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
                    </svg>
                    <span></span>
                </div>
            </div>

            <!-- Kullanıcı Bilgileri (Giriş yapmış kullanıcılar için) -->
            <div id="userInfo" class="mt-6 p-5 rounded-xl glass-card text-white hidden">
                <div class="text-center">
                    <div class="w-16 h-16 bg-gradient-to-br from-blue-500 to-purple-600 rounded-full mx-auto mb-4 flex items-center justify-center">
                        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                        </svg>
                    </div>
                    <h3 class="text-xl font-semibold mb-2">Hoş geldiniz!</h3>
                    <p class="text-sm text-white/70 mb-5">
                        <span id="loggedInUser" class="font-medium">Kullanıcı</span> - <span id="loggedInCompany">Şirket</span>
                    </p>
                    <div class="flex gap-3">
                        <button id="goToApp" class="flex-1 premium-btn text-white font-semibold py-2.5 px-4 rounded-xl transition-all duration-200">
                            Uygulamaya Git
                        </button>
                        <button id="logoutFromIndex" class="flex-1 glass-input hover:bg-red-500/20 text-white font-semibold py-2.5 px-4 rounded-xl transition-all duration-200 border-red-500/30">
                            Çıkış Yap
                        </button>
                    </div>
                </div>
            </div>

            <!-- Hata Mesajı -->
            <div id="errorMessage" class="mt-5 p-4 rounded-xl error-message text-red-200 text-sm hidden">
                <div class="flex items-center">
                    <svg class="w-5 h-5 mr-2 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
                    </svg>
                    <span id="errorText"></span>
                </div>
            </div>

            <!-- Premium Özellikler -->
            <div class="mt-8 pt-6 border-t border-white/10">
                <p class="text-white/60 text-xs text-center mb-4">Premium Özellikler</p>
                <div class="grid grid-cols-3 gap-4">
                    <div class="text-center">
                        <div class="feature-icon w-10 h-10 bg-blue-500/20 rounded-lg mx-auto mb-2 flex items-center justify-center">
                            <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                            </svg>
                        </div>
                        <p class="text-white/70 text-xs">Hızlı</p>
                    </div>
                    <div class="text-center">
                        <div class="feature-icon w-10 h-10 bg-purple-500/20 rounded-lg mx-auto mb-2 flex items-center justify-center">
                            <svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                            </svg>
                        </div>
                        <p class="text-white/70 text-xs">Güvenli</p>
                    </div>
                    <div class="text-center">
                        <div class="feature-icon w-10 h-10 bg-pink-500/20 rounded-lg mx-auto mb-2 flex items-center justify-center">
                            <svg class="w-5 h-5 text-pink-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/>
                    </svg>
                        </div>
                        <p class="text-white/70 text-xs">Premium</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Alt Bilgi -->
        <div class="text-center mt-6">
            <p class="text-white/50 text-sm">
                Sorun mu yaşıyorsunuz? 
                <button id="openSupportChat" class="text-blue-400 hover:text-blue-300 underline transition-colors">Destek Alın</button>
            </p>
        </div>
    </div>
    
    <!-- Sohbet Arayüzü -->
    <div id="chatInterface" class="fixed bottom-4 right-4 w-80 max-h-[600px] bg-white rounded-2xl shadow-2xl border border-gray-200 hidden z-50 flex flex-col">
        <!-- Sohbet Başlığı -->
        <div class="bg-gradient-to-r from-blue-500 to-purple-600 text-white p-4 rounded-t-2xl flex-shrink-0">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M18 10c0 3.866-3.582 7-8 7a8.841 8.841 0 01-4.083-.98L2 17l1.338-3.123C2.493 12.767 2 11.434 2 10c0-3.866 3.582-7 8-7s8 3.134 8 7zM7 9H5v2h2V9zm8 0h-2v2h2V9zM9 9h2v2H9V9z" clip-rule="evenodd"/>
                        </svg>
                    </div>
                    <div>
                        <h3 class="font-semibold">Destek Sohbeti</h3>
                        <p class="text-xs opacity-90">Admin ile iletişim</p>
                    </div>
                </div>
                <button id="closeChat" class="text-white/80 hover:text-white transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Mesaj Alanı -->
        <div id="chatMessages" class="h-[360px] overflow-y-auto p-4 space-y-3 bg-gray-50 relative">
            <!-- Sticky Tarih Header -->
            <div id="chatDateHeader" class="sticky top-0 z-10 bg-gray-50 -mx-4 -mt-4 mb-4 px-4 py-2 border-b border-gray-200 hidden">
                <div class="flex justify-center">
                    <div class="bg-white text-gray-700 px-3 py-1 rounded-full text-xs font-medium shadow-sm">
                        <span id="chatDateHeaderText"></span>
                    </div>
                </div>
            </div>
            <!-- Messages will be loaded here -->
        </div>

        <!-- Mesaj Gönderme -->
        <div class="p-4 border-t border-gray-200">
            <div class="flex space-x-2">
                <input type="text" id="messageInput" placeholder="Mesajınızı yazın..." 
                       class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm">
                <button id="sendMessage" class="premium-btn text-white px-4 py-2 rounded-lg text-sm font-medium">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Sohbet Açma Butonu -->
    <button id="openChat" class="chat-button fixed bottom-4 right-4 w-14 h-14 text-white rounded-full shadow-lg flex items-center justify-center z-40">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
        </svg>
    </button>

    <!-- Scripts -->

    <script src="js/auth.js"></script>
    <script src="js/image-lightbox.js"></script>
    <script src="js/ip-ban-checker.js"></script>
    <script src="js/guest-user-manager.js"></script>
    <script src="js/trial-notifications.js"></script>
    <script src="js/premium-features.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/chat.js"></script>
    
    <script>
        // Support chat button handler
        document.getElementById('openSupportChat')?.addEventListener('click', () => {
            document.getElementById('openChat')?.click();
        });

        // IP banlandıktan sonra index.html'e yönlendirildiğinde sohbeti otomatik aç
        document.addEventListener('DOMContentLoaded', async () => {
            // Banlı IP bilgisini kontrol et
            const blockedIPInfo = localStorage.getItem('blockedIPInfo');
            if (blockedIPInfo) {
                try {
                    const info = JSON.parse(blockedIPInfo);
                    const { ip, username, timestamp } = info;
                    
                    // 5 dakika içinde banlandıysa sohbeti aç (eski kayıtları temizlemek için)
                    const now = Date.now();
                    if (now - timestamp < 5 * 60 * 1000) {
                        // Chat sisteminin yüklenmesini bekle
                        let attempts = 0;
                        const maxAttempts = 20; // 10 saniye
                        const checkChatSystem = setInterval(async () => {
                            attempts++;
                            
                            if (window.chatSystem && window.guestUserManager && window.authUtils) {
                                clearInterval(checkChatSystem);
                                
                                // Sohbeti aç
                                if (window.authUtils.openChatForBlockedIP) {
                                    await window.authUtils.openChatForBlockedIP(ip, username);
                                }
                                
                                // Bilgiyi temizle (bir kere açıldıktan sonra)
                                localStorage.removeItem('blockedIPInfo');
                            } else if (attempts >= maxAttempts) {
                                clearInterval(checkChatSystem);
                                // Zaman aşımı olduysa bilgiyi temizle
                                localStorage.removeItem('blockedIPInfo');
                            }
                        }, 500);
                    } else {
                        // Eski kayıt, temizle
                        localStorage.removeItem('blockedIPInfo');
                    }
                } catch (error) {
                    console.error('Error opening chat for blocked IP:', error);
                    localStorage.removeItem('blockedIPInfo');
                }
            }
        });
    </script>
</body>
</html>
