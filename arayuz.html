<!DOCTYPE html>
<html class="light" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Barcode Login - Refined Pattern</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#135bec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                        "navy-deep": "#0a0f1d",
                        "cobalt-muted": "#1e293b",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        .barcode-bg {
            background: linear-gradient(135deg, #0a0f1d 0%, #132144 100%);
            position: relative;
            overflow: hidden;
        }.barcode-lines {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image:linear-gradient(90deg, 
                    rgba(255, 255, 255, 0.04) 0px, rgba(255, 255, 255, 0.04) 1px, 
                    transparent 1px, transparent 8px,
                    rgba(255, 255, 255, 0.04) 8px, rgba(255, 255, 255, 0.04) 12px, 
                    transparent 12px, transparent 18px,
                    rgba(255, 255, 255, 0.04) 18px, rgba(255, 255, 255, 0.04) 19px, 
                    transparent 19px, transparent 24px,
                    rgba(255, 255, 255, 0.04) 24px, rgba(255, 255, 255, 0.04) 30px,
                    transparent 30px, transparent 34px,
                    rgba(255, 255, 255, 0.04) 34px, rgba(255, 255, 255, 0.04) 35px,
                    transparent 35px, transparent 48px,
                    rgba(255, 255, 255, 0.04) 48px, rgba(255, 255, 255, 0.04) 54px,
                    transparent 54px, transparent 60px,
                    rgba(255, 255, 255, 0.04) 60px, rgba(255, 255, 255, 0.04) 61px,
                    transparent 61px, transparent 72px,
                    rgba(255, 255, 255, 0.04) 72px, rgba(255, 255, 255, 0.04) 78px,
                    transparent 78px, transparent 85px
                );
            background-size: 140px 100%;
            pointer-events: none;
            opacity: 0.6;
        }.barcode-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(90deg, 
                    transparent 0px, transparent 250px,
                    rgba(255, 255, 255, 0.02) 250px, rgba(255, 255, 255, 0.02) 258px,
                    transparent 258px, transparent 600px,
                    rgba(255, 255, 255, 0.02) 600px, rgba(255, 255, 255, 0.02) 615px,
                    transparent 615px
                );
            background-size: 1000px 100%;
            pointer-events: none;
        }
        .scanline {
            width: 100%;
            height: 2px;
            background: linear-gradient(to right, transparent, rgba(19, 91, 236, 0.15), transparent);
            position: absolute;
            top: 35%;
            left: 0;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(19, 91, 236, 0.1);
        }
    </style>
</head>
<body class="font-display bg-background-light dark:bg-background-dark min-h-screen flex items-center justify-center m-0 p-0">
<div class="fixed inset-0 barcode-bg z-0">
<div class="barcode-lines"></div>
<div class="barcode-overlay"></div>
<div class="scanline"></div>
</div>
<div class="relative z-10 w-full max-w-[1200px] flex flex-col items-center justify-center p-6">
<div class="absolute top-0 w-full px-10 py-8 flex justify-between items-center hidden lg:flex">
<div class="flex items-center gap-3 text-white">
<div class="size-6 bg-primary rounded flex items-center justify-center">
<span class="material-symbols-outlined text-white text-sm">barcode_scanner</span>
</div>
<h2 class="text-xl font-bold tracking-tight">Barcode</h2>
</div>
<div class="flex gap-6">
<a class="text-white/70 hover:text-white text-sm font-medium transition-colors" href="#">Destek</a>
<a class="text-white/70 hover:text-white text-sm font-medium transition-colors" href="#">Hakkımızda</a>
</div>
</div>
<div class="bg-white dark:bg-slate-900 w-full max-w-[440px] rounded-xl shadow-2xl overflow-hidden flex flex-col border border-white/10">
<div class="pt-10 pb-6 px-8 text-center border-b border-gray-50 dark:border-slate-800">
<div class="flex justify-center mb-4">
<div class="size-12 rounded-full bg-primary/10 flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-3xl">lock_open</span>
</div>
</div>
<h1 class="text-2xl font-bold text-slate-900 dark:text-white tracking-tight">Barcode</h1>
<p class="text-slate-500 dark:text-slate-400 text-sm mt-1 font-medium italic">Ürün Barkod Arama Sistemi</p>
</div>
<div class="p-8">
<div class="mb-8">
<h2 class="text-xl font-bold text-slate-800 dark:text-slate-100">Hesabınıza Giriş Yapın</h2>
<p class="text-slate-500 dark:text-slate-400 text-sm mt-1">Devam etmek için lütfen bilgilerinizi girin.</p>
</div>
<form class="space-y-5">
<div class="flex flex-col gap-2">
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold">Kullanıcı Adı</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-xl">person</span>
</div>
<input class="w-full pl-10 pr-4 py-3 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-lg text-slate-900 dark:text-white placeholder:text-slate-400 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all" placeholder="Kullanıcı adınızı girin" type="text"/>
</div>
</div>
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold">Şifre</label>
<a class="text-primary text-xs font-semibold hover:underline" href="#">Şifremi Unuttum</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-xl">key</span>
</div>
<input class="w-full pl-10 pr-4 py-3 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-lg text-slate-900 dark:text-white placeholder:text-slate-400 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="flex items-center gap-2 py-1">
<input class="size-4 rounded border-slate-300 dark:border-slate-600 text-primary focus:ring-primary" id="remember" type="checkbox"/>
<label class="text-slate-600 dark:text-slate-400 text-sm cursor-pointer" for="remember">Beni hatırla</label>
</div>
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-3.5 px-4 rounded-lg shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2 group" type="submit">
<span>Giriş Yap</span>
<span class="material-symbols-outlined text-lg group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
<div class="mt-8 pt-6 border-t border-slate-100 dark:border-slate-800 text-center">
<p class="text-slate-500 dark:text-slate-400 text-xs">
                        Bir hesabınız yok mu? <a class="text-primary font-bold hover:underline" href="#">Bize Ulaşın</a>
</p>
</div>
</div>
</div>
<div class="mt-12 flex items-center gap-6 text-white/40 text-[11px] uppercase tracking-widest font-bold">
<div class="flex items-center gap-2">
<span class="size-1.5 rounded-full bg-emerald-500"></span>
                SİSTEM AKTİF
            </div>
<div class="hidden sm:block">|</div>
<div>VERİ MERKEZİ: TR-IST-01</div>
<div class="hidden sm:block">|</div>
<div>VERSION 2.4.0</div>
</div>
</div>

</body></html>
