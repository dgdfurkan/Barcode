<!DOCTYPE html>
<html lang="tr">
<head>
    <script src="../js/jb-diyalog.js?v=20260901b"></script>
    <script src="../js/console-quiet.js?v=20260828i"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1e293b">
    <link rel="manifest" href="../manifest.json">
    <title>Sayım Farkı - Jet Barkod</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/logo.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/logo.png?v=2">
    <link rel="stylesheet" href="../css/main.css?v=20260828i" />
    <link rel="stylesheet" href="../css/tailwind.css?v=20260828i" />
    <link rel="stylesheet" href="../css/tw-app.css?v=20260828i" />
    <link rel="stylesheet" href="../css/jb-diyalog.css?v=20260901a" />
    <link rel="stylesheet" href="../css/bildirim.css?v=20260901a" />
    <link rel="stylesheet" href="../css/motion.css?v=20260907a" />
    <link rel="stylesheet" href="../css/siparisler.css?v=20261014c" />
    <link rel="stylesheet" href="../css/yardimcilar.css?v=20261022b" />
    <style>
        .sf-ozet { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
        .sf-ozet__kutu { flex: 1 1 120px; min-width: 120px; background: var(--kart, #fff); border: 1px solid var(--cizgi, #e2e8f0);
            border-radius: 12px; padding: 12px 16px; }
        .sf-ozet__sayi { font-size: 26px; font-weight: 700; line-height: 1.1; color: var(--metin, #0f172a); }
        .sf-ozet__ad { font-size: 11px; color: var(--soluk, #64748b); margin-top: 4px; }
        .sf-ozet__sayi.is-sifir { color: var(--kirmizi, #dc2626); }
        .sf-arac { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 12px; }
        .sf-ara { flex: 1 1 200px; min-width: 160px; height: 40px; border: 1px solid var(--cizgi, #e2e8f0);
            border-radius: 9px; padding: 0 12px; font-size: 13px; background: var(--kart, #fff); color: var(--metin, #0f172a); }
        .sf-suz { height: 40px; border: 1px solid var(--cizgi, #e2e8f0); border-radius: 999px; padding: 0 14px;
            font-size: 12px; background: var(--kart, #fff); color: var(--metin, #0f172a); cursor: pointer; }
        .sf-suz.is-acik { background: var(--vurgu-yumusak, #eff6ff); border-color: var(--vurgu, #3b82f6); color: var(--vurgu, #2563eb); }
        .sf-tablo-sar { border: 1px solid var(--cizgi, #e2e8f0); border-radius: 12px; overflow: hidden; background: var(--kart, #fff); }
        .sf-tablo { width: 100%; border-collapse: collapse; font-size: 13px; }
        .sf-tablo th { text-align: left; font-size: 11px; font-weight: 600; color: var(--soluk, #64748b);
            padding: 10px 12px; background: var(--yuzey, #f8fafc); border-bottom: 1px solid var(--cizgi, #e2e8f0); white-space: nowrap; }
        .sf-tablo td { padding: 10px 12px; border-bottom: 1px solid var(--cizgi-silik, #f1f5f9); vertical-align: middle; }
        .sf-tablo tr:last-child td { border-bottom: 0; }
        .sf-tablo .sag { text-align: right; font-variant-numeric: tabular-nums; }
        .sf-urun__ad { font-weight: 600; color: var(--metin, #0f172a); }
        .sf-urun__kat { font-size: 11px; color: var(--soluk, #64748b); margin-top: 2px; }
        .sf-fark.art { color: var(--yesil, #16a34a); }
        .sf-fark.eks { color: var(--kirmizi, #dc2626); }
        .sf-rozet { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 700;
            padding: 2px 8px; border-radius: 999px; background: var(--kirmizi-yumusak, #fef2f2); color: var(--kirmizi, #dc2626); }
        .sf-kez { font-size: 11px; color: var(--soluk, #64748b); }
        .sf-tablo tr.is-sifir td { background: var(--kirmizi-yumusak, #fef2f2); }
        .sf-durum { text-align: center; padding: 48px 16px; color: var(--soluk, #64748b); font-size: 13px; }
        @media (max-width: 640px) {
            .sf-gizle-mobil { display: none; }
            .sf-tablo th, .sf-tablo td { padding: 8px 10px; }
        }
    </style>
    <script src="../js/auth-token.js?v=20261007a"></script>
    <script src="../js/db-config.js?v=20260828i"></script>
    <script src="../js/jb-db.js?v=20261014a"></script>
    <script src="../js/auth.js?v=20260919a"></script>
    <script src="../js/oturum-yeri.js?v=20260902a"></script>
    <script src="../js/user-manager.js?v=20260919b"></script>
    <script src="../js/premium-features.js?v=20260828i"></script>
    <script src="../veri/temp_products.js?v=20261030a"></script>
</head>
<body class="min-h-screen sip-kok">
    <header class="sip-ust">
        <div class="sip-ust__ic">
            <a class="sip-marka" href="../arama/" aria-label="Jet Barkod ana sayfa">
                <span class="sip-marka__im"><img src="../assets/logo.png" alt=""></span>
                <span><strong>Jet Barkod</strong><small>Sayım Farkı</small></span>
            </a>
            <nav class="sip-ust__yol" aria-label="Ürün alanları">
                <a href="../yardimcilar/"><svg viewBox="0 0 20 20"><path d="M12.5 15.5 7 10l5.5-5.5"/></svg><span>Yardımcılar</span></a>
                <span class="sip-hesap" id="headerUserName"></span>
            </nav>
        </div>
    </header>

    <main class="sip-sayfa yrd">
        <div id="sfGiris" class="sip-icerik" hidden>
            <div class="sip-kapi">
                <span><svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg></span>
                <strong>Giriş yapman gerekiyor</strong>
                <p>Sayım farkı raporu depo hesabına bağlı çalışıyor.</p>
                <a href="/" class="sip-kapi__dugme">Giriş yap</a>
            </div>
        </div>

        <div id="sfIcerik" class="sip-icerik" hidden>
            <section class="yrd-baslik">
                <h1>Sayım Farkı ve Sıfırlananlar</h1>
                <p>Panelde yapılan sayımlarda sistem ile fiziksel stok arasındaki farklar. Stoğu sıfıra düşen ürünler kırmızı.</p>
            </section>
            <div class="sf-ozet" id="sfOzet" aria-live="polite"></div>
            <div class="sf-arac">
                <input type="search" class="sf-ara" id="sfAra" placeholder="Ürün adında ara" autocomplete="off">
                <button type="button" class="sf-suz" id="sfSadeceSifir">Yalnız sıfırlananlar</button>
            </div>
            <div id="sfGovde"></div>
        </div>
    </main>

    <script src="../js/sifirlanan.js?v=20261030a"></script>
</body>
</html>
