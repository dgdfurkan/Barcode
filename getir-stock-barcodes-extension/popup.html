<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Barkodlar</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 12px;
        width: 360px;
        box-sizing: border-box;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
        font-weight: 600;
      }
      #meta {
        font-size: 11px;
        color: #555;
        margin-bottom: 8px;
        line-height: 1.4;
      }
      textarea {
        width: 100%;
        min-height: 120px;
        font-size: 12px;
        box-sizing: border-box;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 6px;
        resize: vertical;
      }
      button {
        margin-top: 8px;
        padding: 8px 12px;
        font-size: 13px;
        cursor: pointer;
        border-radius: 6px;
        border: 1px solid #333;
        background: #111;
        color: #fff;
      }
      button:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <h1>Mevcut listedeki barkodlar</h1>
    <div id="meta"></div>
    <textarea id="out" readonly placeholder="franchise.getir.com/stock/current sayfasında liste yüklenince buraya düşer. Kategori değişince yeni istek geldikçe güncellenir."></textarea>
    <button type="button" id="copy">Panoya kopyala</button>
    <script src="popup.js"></script>
  </body>
</html>
