<!DOCTYPE html>
<html lang="tr">
<head>
    <script src="../js/jb-diyalog.js?v=20260901b"></script>
    <script src="../js/console-quiet.js?v=20260828i"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1e293b">
    <link rel="manifest" href="../manifest.json">
    <title>Siparişler - Jet Barkod</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/logo.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/logo.png?v=2">
    <link rel="stylesheet" href="../css/main.css?v=20260828i" />
    <link rel="stylesheet" href="../css/tailwind.css?v=20260828i" />
    <link rel="stylesheet" href="../css/tw-app.css?v=20260828i" />
    <link rel="stylesheet" href="../css/jb-diyalog.css?v=20260901a" />
    <link rel="stylesheet" href="../css/bildirim.css?v=20260901a" />
    <link rel="stylesheet" href="../css/siparisler.css?v=20260903a" />
    <script src="../js/auth-token.js?v=20260828i"></script>
    <script src="../js/db-config.js?v=20260828i"></script>
    <script src="../js/jb-db.js?v=20260828i"></script>
    <script src="../js/auth.js?v=20260831a"></script>
    <script src="../js/oturum-yeri.js?v=20260902a"></script>
    <script src="../js/user-manager.js?v=20260828i"></script>
    <script src="../js/premium-features.js?v=20260828i"></script>
    <script src="../js/asistan-koprusu.js?v=20260903a"></script>
</head>
<body class="min-h-screen bg-background sip-kok">
    <header class="bg-surface border-b border-border shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <a href="../arama/" class="flex items-center space-x-3">
                    <img src="../assets/logo.png" alt="Jet Barkod" class="w-8 h-8 object-contain">
                    <div>
                        <h1 class="text-xl sm:text-2xl font-bold text-text-primary">Jet Barkod</h1>
                        <p class="text-xs sm:text-sm text-text-secondary">Siparişler</p>
                    </div>
                </a>
                <div class="flex items-center space-x-3 sm:space-x-4">
                    <a href="../arama/" class="btn-secondary text-sm inline-flex items-center">Ürün Arama</a>
                    <a href="../sayim/" class="btn-secondary text-sm inline-flex items-center hidden sm:inline-flex">Sayım</a>
                    <span id="headerUserName" class="text-sm font-medium text-text-secondary hidden sm:block"></span>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <div id="siparisGiris" hidden>
            <div class="bg-surface rounded-xl border border-border shadow-sm p-12 text-center">
                <p class="text-text-secondary mb-6">Bu sayfayı kullanmak için giriş yapın.</p>
                <a href="/" class="btn-primary inline-flex items-center">Giriş Yap</a>
            </div>
        </div>

        <div id="siparisIcerik" hidden>
            <div class="sip-sekmeler" role="tablist">
                <button type="button" class="sip-sekme" id="sekmeAktif" role="tab" aria-selected="true">
                    Hazırlananlar <span class="sip-sayac" id="sayacAktif">0</span>
                </button>
                <button type="button" class="sip-sekme" id="sekmeBiten" role="tab" aria-selected="false">
                    Toplananlar <span class="sip-sayac" id="sayacBiten">0</span>
                </button>
            </div>

            <div class="sip-izgara" id="siparisIzgara"></div>
        </div>
    </main>

    <!--
      Sipariş detayı. Tam ekran açılıyor; depocu telefonda tek elle
      kullanıyor, yan panel dar ekranda işe yaramıyordu.
    -->
    <section class="sip-detay" id="siparisDetay" hidden aria-label="Sipariş detayı">
        <div class="sip-detay__ust">
            <button type="button" class="sip-geri" id="detayGeri" aria-label="Geri">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg>
            </button>
            <div class="sip-detay__baslik">
                <strong id="detayBanko">-</strong>
                <span id="detayAlt"></span>
            </div>
        </div>

        <div class="sip-detay__govde" id="detayGovde"></div>

        <div class="sip-alt">
            <span class="sip-alt__sayac" id="detaySayac"></span>
            <button type="button" class="sip-bitir" id="detayBitir">Toplandı</button>
        </div>
    </section>

    <script src="../js/siparis-sirala.js?v=20260903a"></script>
    <script src="../js/siparisler.js?v=20260903a"></script>
    <script>
        // Başlıktaki kullanıcı adı; diğer sayfalarla aynı davranış.
        (function () {
            try {
                var o = window.authUtils && window.authUtils.checkAuth();
                var el = document.getElementById('headerUserName');
                if (o && o.username && el) el.textContent = o.username;
            } catch (e) { /* sessiz */ }
        })();
    </script>
</body>
</html>
