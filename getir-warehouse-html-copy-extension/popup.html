<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <style>
        * { box-sizing: border-box; }
        body {
            width: 340px;
            margin: 0;
            padding: 14px 14px 16px;
            font-family: system-ui, -apple-system, Segoe UI, sans-serif;
            font-size: 13px;
            color: #1a1a1a;
            background: linear-gradient(180deg, #fafbfc 0%, #fff 40%);
        }
        h3 { margin: 0 0 6px 0; font-size: 15px; font-weight: 600; }
        .ver {
            font-size: 11px;
            color: #666;
            margin: 0 0 12px 0;
            font-variant-numeric: tabular-nums;
        }
        label {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            cursor: pointer;
            line-height: 1.35;
        }
        input[type="checkbox"] { width: 16px; height: 16px; margin-top: 2px; flex-shrink: 0; }
        .copy-panel {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid #e8eaed;
        }
        .copy-panel h4 {
            margin: 0 0 8px 0;
            font-size: 11px;
            font-weight: 600;
            color: #444;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .copy-block {
            margin-bottom: 10px;
        }
        .copy-block:last-child { margin-bottom: 0; }
        .copy-block .label {
            font-size: 11px;
            color: #666;
            margin-bottom: 4px;
        }
        .copy-block .label strong { color: #2563eb; }
        .preview {
            font-family: ui-monospace, monospace; font-size: 10px; line-height: 1.35;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 8px 8px;
            max-height: 72px;
            overflow: auto;
            word-break: break-all;
            white-space: pre-wrap;
            color: #334155;
            margin: 0;
        }
        .hint {
            font-size: 10px;
            color: #94a3b8;
            margin-top: 8px;
            line-height: 1.35;
        }
        .btn-row {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #e8eaed;
        }
        .btn-row button {
            display: block;
            width: 100%;
            padding: 10px;
            font-size: 13px;
            cursor: pointer;
            background: #4a90e2;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: 500;
        }
        .btn-row button:hover { filter: brightness(1.05); }
    </style>
</head>
<body>
    <h3>🔄 Ayarlar</h3>
    <p class="ver" id="verLine"></p>
    <label>
        <input type="checkbox" id="autoRedirect">
        <span>Kopyalama sonrası Barcode sitesine yönlendir</span>
    </label>

    <div class="copy-panel">
        <h4>Panoya kopyalanan örnekler</h4>
        <div class="copy-block">
            <div class="label"><strong>Sipariş</strong> — tek ürün / HTML (satır)</div>
            <pre class="preview" id="previewOrder">&lt;tr class="ant-table-row"&gt;…</pre>
        </div>
        <div class="copy-block">
            <div class="label"><strong>Sayım</strong> — «Tümünü Kopyala» (Barcode içe aktar)</div>
            <pre class="preview" id="previewSayim">BARCODE_SAYIM_V1
{"version":1,"source":"getir-warehouse-sayim","items":[…]}</pre>
        </div>
        <p class="hint">Sayım çıktısı Barcode → Sayım → <strong>Panodan İçe Aktar</strong> ile yapıştırılır.</p>
    </div>

    <div class="btn-row">
        <button id="testStorage" type="button">🔧 Storage test</button>
    </div>
    <script src="popup.js"></script>
</body>
</html>
